<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Manoj Tiwari — Site Admin</title>
  <!-- Netlify Identity widget: handles admin login -->
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS) — a free visual admin panel.
       It reads config.yml below and lets you add/edit photos and page text
       through a simple form UI. Every save creates a commit in your GitHub
       repo, and your host rebuilds the live site automatically.
       Full setup instructions: see HOSTING_GUIDE.md -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Redirect logged-out visitors straight into the Identity login flow.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
</body>
</html>
